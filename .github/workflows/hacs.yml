name: HACS Action
on: [push, pull_request]
jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run EV regression tests
        run: node --test tests/*.test.mjs
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: plugin
